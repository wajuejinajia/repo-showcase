<!doctype html>
<!-- Start from this file. Replace every {{PLACEHOLDER}} before delivery. -->
<html lang="{{LANG}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{DESCRIPTION}}">
  <title>{{PROJECT_NAME}} — {{TAGLINE}}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; font-family: var(--font, system-ui, sans-serif); background: var(--bg, #fff); color: var(--text, #111); }
    img { display: block; max-width: 100%; }
    a { color: inherit; }
    :focus-visible { outline: 3px solid var(--focus, #2563eb); outline-offset: 3px; }

    /* Keep only the shared helpers allowed by the selected style. */
    .reveal { opacity: 0; transform: translateY(24px); transition: opacity .7s ease-out, transform .7s ease-out; }
    .reveal.visible { opacity: 1; transform: none; }
    .codeblock { position: relative; }
    .copy-btn { cursor: pointer; }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      .reveal { opacity: 1; transform: none; }
    }

    /* Add the selected style's tokens and component rules below. */
  </style>
</head>
<body>
  <nav aria-label="Primary navigation">
    <!-- Project name, supported section anchors, and repository link. -->
  </nav>

  <main>
    <header class="hero">
      <h1>{{PROJECT_NAME}}</h1>
      <p>{{TAGLINE}}</p>
      <!-- Use only CTAs backed by repository information. -->
    </header>

    <!-- Add evidence-backed sections as appropriate. -->
  </main>

  <footer>
    <!-- License, author, repository link, and year only when sourced. -->
  </footer>

  <script>
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!reducedMotion && 'IntersectionObserver' in window) {
      const observer = new IntersectionObserver(entries => entries.forEach(entry => {
        if (entry.isIntersecting) { entry.target.classList.add('visible'); observer.unobserve(entry.target); }
      }), { threshold: 0.15 });
      document.querySelectorAll('.reveal').forEach(element => observer.observe(element));
    } else {
      document.querySelectorAll('.reveal').forEach(element => element.classList.add('visible'));
    }

    async function copyText(text) {
      try {
        if (navigator.clipboard?.writeText && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (_) { /* Fall through to the local-file fallback. */ }
      const area = document.createElement('textarea');
      area.value = text;
      area.setAttribute('readonly', '');
      area.style.position = 'fixed';
      area.style.opacity = '0';
      document.body.append(area);
      area.select();
      const copied = document.execCommand('copy');
      area.remove();
      return copied;
    }

    document.querySelectorAll('[data-copy]').forEach(button => button.addEventListener('click', async () => {
      const source = document.querySelector(button.dataset.copy);
      if (!source) return;
      const original = button.textContent;
      button.textContent = await copyText(source.textContent.trim()) ? 'Copied' : 'Copy manually';
      setTimeout(() => { button.textContent = original; }, 1800);
    }));
  </script>
</body>
</html>
